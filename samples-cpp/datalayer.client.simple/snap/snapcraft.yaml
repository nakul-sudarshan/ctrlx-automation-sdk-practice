# Getting started
# See https://snapcraft.io/docs/getting-started
# Snapcraft references
# See https://snapcraft.io/docs/snapcraft-yaml-reference

name: sdk-cpp-client-simple
title: SDK C++ Client Simple
version: 1.0.0
grade: stable

contact: https://github.com/boschrexroth/ctrlx-automation-sdk
license: MIT
donation: https://github.com/boschrexroth/ctrlx-automation-sdk
issues: https://github.com/boschrexroth/ctrlx-automation-sdk/issues
source-code: https://github.com/boschrexroth/ctrlx-automation-sdk
website: https://github.com/boschrexroth/ctrlx-automation-sdk

summary: Sample app for datalayer client
description: |
  This app will read ctrlX Data Layer nodes and print out their value.
base: core24
confinement: strict

platforms:
  amd64:
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

# define how apps & services are exposed to host system
apps:
  # app:
  #   command: datalayerClientSimple
  #   # interfaces to connect to https://snapcraft.io/docs/supported-interfaces
  #   plugs:
  #     - network
  #     - datalayer
  #     - active-solution
  #   daemon: simple
  #   passthrough:
  #     restart-condition: always
  #     restart-delay: 10s
  app:
    command: bin/start.sh
    plugs:
      - network
      - datalayer
      - active-solution
    daemon: simple
    passthrough:
      restart-condition: always
      restart-delay: 10s

parts:
  datalayerclient:
    plugin: dump
    source: ./generated/build
    stage-packages:
      - ctrlx-datalayer

  startup:
    plugin: dump
    source: ./scripts
    organize:
      start.sh: bin/start.sh

# describes which interface slots are supported by defining the plugs
plugs:
  datalayer:
    interface: content
    content: datalayer
    target: $SNAP_DATA/.datalayer
  active-solution:
    interface: content
    content: solutions
    target: $SNAP_COMMON/solutions

# enables the hook to get access to plug
hooks:
  connect-plug-active-solution:
    plugs: [active-solution]

lint:
  ignore:
    - library:
        - usr/lib/aarch64-linux-gnu/libcomm_datalayer.so.*
        - usr/lib/x86_64-linux-gnu/libcomm_datalayer.so.*
